services:
  portico:
    build: .
    image: portico:latest
    container_name: portico
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Set a strong SESSION_SECRET in a .env file for any real deployment.
      SESSION_SECRET: ${SESSION_SECRET:-change-me-home-topology}
      # Set true when serving over HTTPS (e.g. behind a reverse proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # Named volume persists the SQLite DB + cached selfh.st icons across restarts.
      # Prefer a host path? swap for:  - ./data:/app/data
      - portico_data:/app/data

volumes:
  portico_data:
